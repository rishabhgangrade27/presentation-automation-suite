services:
  n8n:
    image: n8nio/n8n:latest
    container_name: presenton-suite-n8n
    restart: unless-stopped
    ports:
      # Host port 5679 (not n8n's default 5678) so this project never collides
      # with another n8n instance you might already have running locally.
      - "${N8N_HOST_PORT:-5679}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_HOST_PORT:-5679}/
      - N8N_RUNNERS_ENABLED=true
      - GENERIC_TIMEZONE=${TZ:-Asia/Kolkata}
      # PRESENTON_BASE_URL is read inside the workflow's HTTP Request node
      # expressions via $env.PRESENTON_BASE_URL.
      - PRESENTON_BASE_URL=${PRESENTON_BASE_URL:-http://host.docker.internal:5001}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
